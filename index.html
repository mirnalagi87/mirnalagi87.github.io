<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F9FAFB; --surface:#FFFFFF; --text:#0B1220; --muted:#6B7280;
  --hairline:#E5E7EB; --black:#0B1220;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:'Poppins',var(--font);
}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

.hdr{width:100%;border-bottom:1px solid var(--hairline);background:var(--surface)}
.wrap{width:100%;max-width:1152px;margin:0 auto;padding:0 24px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-0.04em;line-height:1}
.logo .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(150deg,#3b82f6,#2563eb);box-shadow:0 2px 6px rgba(37,99,235,.45)}

.main{flex:1;width:100%;max-width:540px;margin:0 auto;padding:24px 16px 0}

/* 9:16 Reels player */
.player{
  position:relative;
  width:100%;
  max-width:420px;
  margin:0 auto;
  aspect-ratio:9/16;
  max-height:min(86vh,820px);
  background:#000;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 36px rgba(11,18,32,.18);
}
.video{display:block;width:100%;height:100%;object-fit:contain;background:#000}

.watch-meta-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:12px 0 6px}
.vtitle{font-size:15px;font-weight:600;line-height:1.35;margin:0 0 2px;max-height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vmeta{opacity:.7;margin:0;font-size:14px;display:none}
body.is-admin .vmeta{display:block}

.info{padding:12px 2px 0}
.admin-panel{
  display:none;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  padding:14px;
  border-radius:8px;
  margin-bottom:16px;
  font-family:ui-monospace,monospace;
  font-size:13px;
}
.admin-panel:not([hidden]){display:block}
.admin-panel-head{font-weight:700;margin-bottom:8px;color:#0f172a;display:flex;justify-content:space-between;align-items:center}
.admin-copy{font-size:11px;padding:3px 8px;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer}
.admin-grid{display:grid;grid-template-columns:120px 1fr;gap:6px;color:#334155}

.ftr{margin-top:32px;padding:24px 32px 28px;display:flex;align-items:center;justify-content:center;gap:28px;font-size:14px}
.ftr a{color:var(--muted)}
.ftr a:hover{color:var(--text)}

@media(max-width:580px){
  .wrap{padding:0 16px}
  .logo{font-size:22px}
  .main{padding:10px 0 0;max-width:100%}
  .player{max-width:100%;border-radius:0;max-height:86vh}
  .ftr{padding:20px 16px;gap:22px;font-size:13px}
  .watch-meta-top{flex-direction:column;padding:0 12px}
  .info{padding:12px}
}
</style>
</head>
<body>
  <header class="hdr">
    <div class="wrap">
      <div class="hdr-row">
      </div>
    </div>
  </header>
<script async="async" data-cfasync="false" src="https://playwrightsling.com/d3e082d534e1581e0f78d3cfe456f0d9/invoke.js"></script>
<div id="container-d3e082d534e1581e0f78d3cfe456f0d9"></div>
  <main class="main">
    <div id="player" class="player">
      <video id="video" class="video" controls playsinline preload="metadata" controlslist="nodownload"></video>
    </div>

    <div class="watch-meta-top">
      <div>
        <p class="vmeta"><span id="viewCount"></span> · <span id="uploadedAt"></span></p>
      </div>
    </div>

    <div class="info">
      <div id="adminVideoPanel" class="admin-panel" hidden>
        <div class="admin-panel-head">
          <span>Admin video</span>
        </div>
        <div class="admin-grid">
          <strong>Video ID:</strong> <span id="adminVidId">-</span>
          <strong>Storage Key:</strong> <span id="adminStorageKey">-</span>
          <strong>Total Views:</strong> <span id="adminViews">-</span>
          <strong>Tanggal Upload:</strong> <span id="adminUploadedAt">-</span>
          <strong>Direct URL:</strong> <a id="adminDirectLink" href="#" target="_blank">-</a>
        </div>
      </div>
    </div>
  </main>
  
  <footer class="ftr">
    <a href="/">All videos</a>
    <a href="about.html">About</a>
    <a href="privacy.html">Privacy</a>
  </footer>

<script>
(function () {
  function $(id) { return document.getElementById(id); }

  var params = new URLSearchParams(location.search);
  var srcParam = params.get('src') || '';
  var vid = params.get('v') || params.get('id') || '';
  var isId = /^[A-Za-z0-9]{6,32}$/.test(vid);
  var CDN = 'https://cdn2.videy.co/';
  var videoUrl = isId ? CDN + vid + '.mp4' : '';

  var video = $('video');
  var titleEl = $('videoTitle');

  document.documentElement.lang = 'en';
  document.title = vid ? 'Watch On Slicevidey - ' + vid : 'Watch On Slicevidey';
  if (titleEl && vid) titleEl.textContent = vid;

  try {
    if (sessionStorage.getItem('sd_admin_pw')) document.body.classList.add('is-admin');
  } catch (e) {}

  window.copyAdminVidId = function () {
    var text = ($('adminVidId') && $('adminVidId').textContent) || vid || '';
    if (!text || text === '-') return;
    navigator.clipboard.writeText(text).then(function () {
      alert('Video ID copied: ' + text);
    }).catch(function () {
      prompt('Copy ID', text);
    });
  };

  var panel = $('adminVideoPanel');
  var isAdmin = false;
  try { isAdmin = !!sessionStorage.getItem('sd_admin_pw'); } catch (e) {}
  if (panel && isAdmin && isId) {
    panel.hidden = false;
    panel.style.display = 'block';
    if ($('adminVidId')) $('adminVidId').textContent = vid;
    if ($('adminStorageKey')) $('adminStorageKey').textContent = '-';
    if ($('adminViews')) $('adminViews').textContent = '-';
    if ($('adminUploadedAt')) $('adminUploadedAt').textContent = '-';
    if ($('adminDirectLink')) {
      $('adminDirectLink').href = videoUrl;
      $('adminDirectLink').textContent = videoUrl;
    }
  }

  if (/^https?:\/\//i.test(srcParam)) {
    video.src = srcParam;
    video.load();
  } else if (isId && video) {
    video.src = videoUrl;
    video.load();
  }
})();
</script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script><!-- Google tag (gtag.js) -->

</script></body>
</html>
