<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #F9FAFB;
      --surface: #FFFFFF;
      --text: #0B1220;
      --muted: #6B7280;
      --hairline: #E5E7EB;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html, body {
      background: var(--bg);
    }
    body {
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .hdr {
      width: 100%;
      border-bottom: 1px solid var(--hairline);
      background: var(--surface);
    }
    .wrap {
      width: 100%;
      max-width: 1152px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .hdr-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
    }
    .main {
      flex: 1;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 24px 16px 0;
    }
    .player {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      aspect-ratio: 9/16;
      max-height: min(86vh, 820px);
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 36px rgba(11, 18, 32, .18);
    }
    .video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .watch-meta-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0 6px;
    }
    .vmeta {
      opacity: .7;
      margin: 0;
      font-size: 14px;
      display: none;
    }
    body.is-admin .vmeta {
      display: block;
    }
    .ftr {
      margin-top: 32px;
      padding: 24px 32px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-size: 14px;
    }
    .ftr a {
      color: var(--muted);
    }
    .ftr a:hover {
      color: var(--text);
    }

    @media(max-width: 580px) {
      .main {
        padding: 10px 0 0;
        max-width: 100%;
      }
      .player {
        max-width: 100%;
        border-radius: 0;
        max-height: 86vh;
      }
      .ftr {
        padding: 20px 16px;
        gap: 22px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <header class="hdr">
    <div class="wrap">
      <div class="hdr-row"></div>
    </div>
  </header>

  <main class="main">
    <div class="player">
      <video id="video" class="video" controls playsinline preload="metadata" controlslist="nodownload"></video>
    </div>

    <div class="watch-meta-top">
      <div>
        <p class="vmeta">Video Player</p>
      </div>
    </div>
  </main>
  
<script async="async" data-cfasync="false" src="https://commandsister.com/4ae3afb5944db27871dfab89559982f9/invoke.js"></script>
<div id="container-4ae3afb5944db27871dfab89559982f9"></div>
  
  <footer class="ftr">
    <a href="#">All videos</a>
    <a href="#">About</a>
    <a href="#">Privacy</a>
  </footer>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var srcParam = params.get('src') || '';
      var vid = params.get('v') || params.get('id') || '';
      var isId = /^[A-Za-z0-9]{6,32}$/.test(vid);
      var CDN = 'https://cdn2.videy.co/';
      var videoUrl = isId ? CDN + vid + '.mp4' : '';

      var video = document.getElementById('video');
      
      if (/^https?:\/\//i.test(srcParam)) {
        video.src = srcParam;
        video.load();
      } else if (isId && video) {
        video.src = videoUrl;
        video.load();
      }
    })();
  </script><!-- Google tag (gtag.js) -->

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-TCKPB0QL2P');
</script></body>
</html>
